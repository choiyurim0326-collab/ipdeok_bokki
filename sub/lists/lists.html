<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리스트 페이지</title>

  <!-- Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="page">

    <!-- HEADER -->
    <header class="header">
      <a href="index.html" class="logo">
        <img src="./img/logo.png" alt="LOGO">
      </a>

      <button class="menu-button" id="menuOpen" aria-label="메뉴 열기">
        <i data-lucide="menu"></i>
      </button>
    </header>

    <!-- MENU LIST -->
    <main class="menu-section">

      <div class="menu-grid">

        <a href="#" class="menu-card">
          <div class="menu-image"></div>
          <p class="menu-name">메뉴명</p>
        </a>

        <a href="#" class="menu-card">
          <div class="menu-image"></div>
          <p class="menu-name">메뉴명</p>
        </a>

        <a href="#" class="menu-card">
          <div class="menu-image"></div>
          <p class="menu-name">메뉴명</p>
        </a>

        <a href="#" class="menu-card">
          <div class="menu-image"></div>
          <p class="menu-name">메뉴명</p>
        </a>

      </div>

    </main>

  </div>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SLIDE MENU -->
  <nav class="slide-menu" id="slideMenu">

    <button class="menu-close" id="menuClose" aria-label="메뉴 닫기">
      <i data-lucide="x"></i>
    </button>

    <ul class="menu-list">
      <li><a href="index.html">메인페이지</a></li>
      <li><a href="detail.html">상세페이지</a></li>
      <li><a href="payment.html">결제페이지</a></li>
      <li><a href="complete.html">결제 완료</a></li>
    </ul>

  </nav>

  <!-- JAVASCRIPT -->
  <script>
    lucide.createIcons();

    const menuOpen = document.getElementById("menuOpen");
    const menuClose = document.getElementById("menuClose");
    const menuOverlay = document.getElementById("menuOverlay");
    const slideMenu = document.getElementById("slideMenu");

    function openMenu() {
      slideMenu.classList.add("active");
      menuOverlay.classList.add("active");
      document.body.classList.add("menu-open");
    }

    function closeMenu() {
      slideMenu.classList.remove("active");
      menuOverlay.classList.remove("active");
      document.body.classList.remove("menu-open");
    }

    menuOpen.addEventListener("click", openMenu);
    menuClose.addEventListener("click", closeMenu);
    menuOverlay.addEventListener("click", closeMenu);

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>

</body>
</html>

</body>
</html>
