<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 상세페이지 | 입덕볶이</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/detail.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="detail-page">

    <!-- HEADER -->
    <header class="header">
      <a href="../../index.html" class="header__logo" aria-label="메인 페이지">
        <img src="../../img/logo.png" alt="입덕볶이">
      </a>

      <button class="header__menu" id="menuOpen" type="button"
        aria-label="메뉴 열기" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
    </header>

    <main>
      <!-- MENU IMAGE -->
      <div class="main-image" id="menuImage"></div>

      <!-- MENU DETAIL -->
      <section class="detail-content">

        <p class="page-title">MENU DETAIL</p>

        <div class="product-info">
          <h1 id="menuName">메뉴 이름</h1>
          <p id="menuDescription"></p>
          <strong id="menuPrice" class="base-price"></strong>
        </div>

        <!-- SPICY LEVEL -->
        <section class="option-section" id="spicySection">
          <div class="option-heading">
            <h2>맵기 선택</h2>
            <span>필수 선택</span>
          </div>

          <div class="spicy-options">
            <label class="option-card">
              <input type="radio" name="spicy" value="0">
              <span>
                <strong>순한맛</strong>
                <small>맵지 않고 부드러운 맛</small>
              </span>
            </label>

            <label class="option-card">
              <input type="radio" name="spicy" value="1" checked>
              <span>
                <strong>보통맛</strong>
                <small>신라면 정도의 맵기</small>
              </span>
            </label>

            <label class="option-card">
              <input type="radio" name="spicy" value="2">
              <span>
                <strong>매운맛</strong>
                <small>불닭볶음면 정도의 맵기</small>
              </span>
            </label>

            <label class="option-card">
              <input type="radio" name="spicy" value="3">
              <span>
                <strong>아주 매운맛</strong>
                <small>핵불닭볶음면 정도의 맵기</small>
              </span>
            </label>
          </div>
        </section>

        <!-- SIDE OPTIONS -->
        <section class="option-section" id="sideSection">
          <div class="option-heading">
            <h2>사이드 추가</h2>
            <span>선택 사항</span>
          </div>

          <label class="side-option">
            <span>
              <strong>치즈 추가</strong>
              <small>고소한 모짜렐라 치즈</small>
            </span>
            <span class="side-price">+2,000원</span>
            <input type="checkbox" id="cheeseOption">
          </label>

          <div class="side-option fried-option">
            <div>
              <strong>모둠 튀김 추가</strong>
              <small>바삭한 모둠 튀김 · 1개 5,000원</small>
            </div>

            <div class="quantity-control">
              <button type="button" id="friedMinus" aria-label="튀김 수량 줄이기">−</button>
              <span id="friedQuantity">0</span>
              <button type="button" id="friedPlus" aria-label="튀김 수량 늘리기">+</button>
            </div>
          </div>
        </section>

        <!-- MAIN QUANTITY -->
        <section class="option-section">
          <div class="option-heading">
            <h2>수량 선택</h2>
          </div>

          <div class="quantity-row">
            <span>메인 메뉴 수량</span>

            <div class="quantity-control">
              <button type="button" id="mainMinus" aria-label="수량 줄이기">−</button>
              <span id="mainQuantity">1</span>
              <button type="button" id="mainPlus" aria-label="수량 늘리기">+</button>
            </div>
          </div>
        </section>

        <!-- TOTAL PRICE -->
        <section class="total-section">
          <span>총 주문 금액</span>
          <strong id="totalPrice">0원</strong>
        </section>

        <!-- ORDER BUTTON -->
        <button type="button" class="order-button" id="orderButton">
          주문하기
        </button>

        <a href="../lists/lists.html" class="back-link">전체 메뉴로 돌아가기</a>

      </section>
    </main>
  </div>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SLIDE MENU -->
  <nav class="slide-menu" id="slideMenu">

    <div class="slide-menu__header">
      <h2>MENU</h2>

      <button class="slide-menu__close" id="menuClose" type="button"
        aria-label="메뉴 닫기">
        <i data-lucide="x"></i>
      </button>
    </div>

    <!-- LOGIN STATUS -->
    <div class="slide-menu__auth">
      <p class="slide-menu__auth-status" id="authStatus">
        로그인 상태를 확인하고 있어요.
      </p>

      <strong class="slide-menu__auth-name" id="authName"></strong>

      <a href="../../login.html"
        class="slide-menu__auth-button"
        id="loginButton">
        로그인
      </a>

      <button type="button"
        class="slide-menu__auth-button"
        id="logoutButton"
        style="display: none;">
        로그아웃
      </button>
    </div>

    <!-- MENU LIST -->
    <ul class="slide-menu__list">
      <li><a href="../../index.html">메인 페이지</a></li>
      <li><a href="../lists/lists.html">전체 메뉴</a></li>
      <li><a href="./detail.html">메뉴 상세</a></li>
    </ul>

  </nav>

  <script>
    lucide.createIcons();

    // 메뉴 데이터
    const menuData = {
      tteokbokki: {
        name: "매콤달콤 떡볶이",
        description: "쫄깃한 떡과 매콤달콤한 특제 소스로 완성한 입덕볶이 대표 메뉴",
        price: 5500,
        image: "../../img/menu-tteokbokki.jpg",
        type: "tteok"
      },
      cheese: {
        name: "치즈 듬뿍 떡볶이",
        description: "고소하고 부드러운 모짜렐라 치즈를 듬뿍 올린 인기 메뉴",
        price: 7000,
        image: "../../img/menu-cheese.jpg",
        type: "tteok"
      },
      soup: {
        name: "국물 떡볶이",
        description: "진하고 얼큰한 국물에 떡과 어묵을 넉넉하게 담은 메뉴",
        price: 6000,
        image: "../../img/menu-soup.jpg",
        type: "tteok"
      },
      fried: {
        name: "모둠 튀김",
        description: "바삭하게 튀겨낸 다양한 튀김을 한 번에 즐기는 사이드 메뉴",
        price: 5000,
        image: "../../img/menu-fried.jpg",
        type: "side"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const menuKey = params.get("menu") || "tteokbokki";
    const selectedMenu = menuData[menuKey] || menuData.tteokbokki;

    // 메뉴 정보 표시
    document.getElementById("menuName").textContent = selectedMenu.name;
    document.getElementById("menuDescription").textContent = selectedMenu.description;
    document.getElementById("menuPrice").textContent =
      selectedMenu.price.toLocaleString("ko-KR") + "원";

    document.getElementById("menuImage").style.backgroundImage =
      `url("${selectedMenu.image}")`;

    // 튀김 단독 메뉴에서는 맵기와 사이드 숨기기
    if (selectedMenu.type === "side") {
      document.getElementById("spicySection").style.display = "none";
      document.getElementById("sideSection").style.display = "none";
    }

    // 수량 및 옵션
    let mainQuantity = 1;
    let friedQuantity = 0;

    const mainQuantityText = document.getElementById("mainQuantity");
    const friedQuantityText = document.getElementById("friedQuantity");
    const totalPriceText = document.getElementById("totalPrice");
    const cheeseOption = document.getElementById("cheeseOption");

    function updatePrice() {
      const mainTotal = selectedMenu.price * mainQuantity;

      const cheeseTotal =
        selectedMenu.type === "tteok" && cheeseOption.checked ? 2000 : 0;

      const friedTotal =
        selectedMenu.type === "tteok" ? friedQuantity * 5000 : 0;

      const total = mainTotal + cheeseTotal + friedTotal;

      mainQuantityText.textContent = mainQuantity;
      friedQuantityText.textContent = friedQuantity;
      totalPriceText.textContent = total.toLocaleString("ko-KR") + "원";
    }

    // 메인 수량
    document.getElementById("mainMinus").addEventListener("click", function() {
      if (mainQuantity > 1) {
        mainQuantity--;
        updatePrice();
      }
    });

    document.getElementById("mainPlus").addEventListener("click", function() {
      mainQuantity++;
      updatePrice();
    });

    // 튀김 수량
    document.getElementById("friedMinus").addEventListener("click", function() {
      if (friedQuantity > 0) {
        friedQuantity--;
        updatePrice();
      }
    });

    document.getElementById("friedPlus").addEventListener("click", function() {
      friedQuantity++;
      updatePrice();
    });

    cheeseOption.addEventListener("change", updatePrice);

    // 첫 가격 표시
    updatePrice();

    // 주문하기
    document.getElementById("orderButton").addEventListener("click", function() {
      const spicyInput = document.querySelector('input[name="spicy"]:checked');

      const spicyNames = [
        "순한맛",
        "보통맛 (신라면 정도)",
        "매운맛 (불닭볶음면 정도)",
        "아주 매운맛 (핵불닭볶음면 정도)"
      ];

      const spicyLevel =
        selectedMenu.type === "tteok" && spicyInput
          ? spicyNames[Number(spicyInput.value)]
          : "해당 없음";

      const cheeseCount =
        selectedMenu.type === "tteok" && cheeseOption.checked ? 1 : 0;

      const friedCount =
        selectedMenu.type === "tteok" ? friedQuantity : 0;

      const total =
        selectedMenu.price * mainQuantity +
        cheeseCount * 2000 +
        friedCount * 5000;

      const orderData = {
        menuName: selectedMenu.name,
        menuPrice: selectedMenu.price,
        menuQuantity: mainQuantity,
        spicyLevel: spicyLevel,
        cheeseCount: cheeseCount,
        friedCount: friedCount,
        totalPrice: total
      };

      localStorage.setItem("ipdeokOrder", JSON.stringify(orderData));

      window.location.href = "../payment/payment.html";
    });

    // 슬라이드 메뉴
    const menuOpen = document.getElementById("menuOpen");
    const menuClose = document.getElementById("menuClose");
    const menuOverlay = document.getElementById("menuOverlay");
    const slideMenu = document.getElementById("slideMenu");

    function openMenu() {
      slideMenu.classList.add("active");
      menuOverlay.classList.add("active");
      document.body.classList.add("menu-open");
      menuOpen.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      slideMenu.classList.remove("active");
      menuOverlay.classList.remove("active");
      document.body.classList.remove("menu-open");
      menuOpen.setAttribute("aria-expanded", "false");
    }

    menuOpen.addEventListener("click", openMenu);
    menuClose.addEventListener("click", closeMenu);
    menuOverlay.addEventListener("click", closeMenu);

    document.querySelectorAll(".slide-menu__list a").forEach(function(link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });

    // 로그인 상태 표시
    const authStatus = document.getElementById("authStatus");
    const authName = document.getElementById("authName");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");

    function updateLoginStatus() {
      const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");

      if (currentUser) {
        authStatus.textContent = "로그인 중입니다.";
        authName.textContent = currentUser.name
          ? currentUser.name + "님 환영합니다."
          : "";

        loginButton.style.display = "none";
        logoutButton.style.display = "block";
      } else {
        authStatus.textContent = "로그인이 필요합니다.";
        authName.textContent = "";

        loginButton.style.display = "block";
        logoutButton.style.display = "none";
      }
    }

    // 로그아웃
    logoutButton.addEventListener("click", function() {
      localStorage.removeItem("currentUser");

      updateLoginStatus();
      closeMenu();

      alert("로그아웃되었습니다.");
    });

    updateLoginStatus();
  </script>
</body>
</html>
